name: Vérification quotidienne ESPN

# Chaque jour, vérifie que la source de données répond toujours au bon format.
# En cas d'échec, GitHub envoie un email (réglage par défaut des notifications Actions).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-espn.mjs
      # Service d'alertes : il doit avoir tourné dans les 5 dernières minutes (sinon email d'échec).
      - name: Vérifier le service d'alertes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "Alertes non configurées"; exit 0; fi
          sub=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
          echo "::add-mask::$sub"
          status=$(curl -s -m 20 "https://scores-alerts.$sub.workers.dev/status")
          echo "$status" | jq '{ok, lastTickSecondsAgo, subs, followed, active, error}'
          echo "$status" | jq -e '.ok == true' > /dev/null || { echo "Le service d'alertes ne tourne plus normalement"; exit 1; }
      # GitHub suspend les tâches planifiées d'un dépôt public sans activité depuis 60 jours.
      # On réactive le planning à chaque passage : il ne s'arrête donc jamais (aucun commit nécessaire).
      - name: Garder la vérification active
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check-espn.yml/enable"
