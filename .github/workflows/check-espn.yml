name: Vérification quotidienne ESPN

# Chaque jour, vérifie que la source de données répond toujours au bon format.
# En cas d'échec, GitHub envoie un email (réglage par défaut des notifications Actions).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-espn.mjs
      # GitHub suspend les tâches planifiées d'un dépôt public sans activité depuis 60 jours.
      # On réactive le planning à chaque passage : il ne s'arrête donc jamais (aucun commit nécessaire).
      - name: Garder la vérification active
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check-espn.yml/enable"
